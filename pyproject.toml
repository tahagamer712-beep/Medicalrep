[project]
name = "medical-rep-system"
version = "0.1.0"
description = "Multi-company medical representative management system (phone-manageable)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn>=0.30,<0.32",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "pydantic>=2.7,<2.10",
    "pydantic-settings>=2.3,<2.6",
    "python-telegram-bot>=21.0,<22.0",
    "openpyxl>=3.1,<3.2",
    "apscheduler>=3.10,<3.11",
    "cryptography>=42.0,<44.0",
    "python-dateutil>=2.9,<2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<8.4",
    "pytest-asyncio>=0.23,<0.25",
    "httpx>=0.27,<0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
